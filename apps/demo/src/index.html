<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>@trade/ui — reference demo</title>
  <link rel="stylesheet" href="./ui.css" />
  <style>
    body { margin: 0; }
    .app-bar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: var(--ui-space-3);
      padding: var(--ui-space-3) var(--ui-space-5);
      background: var(--ui-surface);
      border-bottom: 1px solid var(--ui-outline);
    }
    .app-bar__brand { font-weight: 600; }
    .app-bar__brand small { font-weight: 400; color: var(--ui-on-surface-muted); font-family: var(--ui-font-numeric); margin-left: 6px; }
    .app-bar__spacer { flex: 1; }
    .page { max-width: 1180px; margin: 0 auto; padding: var(--ui-space-5); }
    .muted { color: var(--ui-on-surface-muted); font-size: var(--ui-font-size-sm); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./app.js"></script>
</body>
</html>
