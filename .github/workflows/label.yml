name: Label PRs

# pull_request_target (not pull_request) so fork PRs can be labelled too: the token
# carries write permission. The labeler queries the GitHub API only — this workflow
# never checks out PR code, so the extra permission is not exposed to untrusted code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: auto-label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
