name: CI

# NOTE: this repository root IS the `ui/` workspace (package `@trade/ui`).
# If the repo is ever moved up to a parent directory, re-add a `ui/` prefix to
# every `working-directory` and `path` below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege everywhere; no job needs write scope.
permissions:
  contents: read

# One run per ref. A force-push during review otherwise leaves two full 3-engine browser suites
# competing for the same minutes, and only the newest one can be acted on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The project has independent gates, so they run as separate jobs:
#   build  — the package must compile and emit declarations
#   size   — bundle budgets must hold
#   verify — library checks, demo checks, and the 3-engine browser suite
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # Bounded so a hung install or gate cannot burn the 360-minute default before anyone notices.
    timeout-minutes: 25
    steps:
      # full history so check:commits can validate the pushed range
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install
        run: npm ci
      - name: Build tokens + library
        run: npm run build
      - name: Assert the library ships zero runtime dependencies
        run: node scripts/check-contract.mjs
      - name: Assert the published tarballs are correct (entry points, terms, no leaks)
        run: npm run check:pack

      # The tarball as a consumer receives it. Running the gate is not enough -- this step is what makes
      # it a gate: the workflow runs commands individually and never invokes `npm run ci`.
      - name: Install the packed tarballs into a project outside the repo and use them
        run: npm run verify:consumer

      - name: Enforce the token contrast contract across every theme
        run: node scripts/check-contrast.mjs
      - name: Enforce the CSS authoring contract
        run: node scripts/check-style.mjs
      - name: Typecheck (strict, no emit)
        run: npm run check:types
      - name: Unit tests (node:test, no browser)
        run: npm test
      - name: Licence headers and manifests (MIT OR Apache-2.0)
        run: npm run check:license
      - name: Docs integrity (links, documented counts, exceptions)
        run: npm run check:docs
      # The floor is derived from what the stylesheets use, so it has to be re-derived whenever they
      # change. Like every other gate here it needs its own workflow step: the chain below is not what
      # CI runs, the steps are.
      - name: Browser floor (the document and the code agree)
        run: npm run check:support
      - name: Perf retry policy (every branch, pinned 25 ms budget)
        run: npm run check:perf-policy
      - name: Commit subjects (pushed range)
        if: github.event_name == 'push'
        run: npm run check:commits
      - name: Commit subjects (pull-request range)
        if: github.event_name == 'pull_request'
        run: node scripts/check-commits.mjs ${{ github.event.pull_request.base.sha }}..HEAD
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            packages/ui/dist
            packages/tokens/dist
          retention-days: 7

  size:
    name: size budgets
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Enforce bundle budgets
        run: npm run size

  verify:
    name: verification
    timeout-minutes: 35
    # Runs INSIDE the digest-pinned Playwright image — the same image the baselines job
    # regenerates baselines/linux/ in — so the browser/font environment matches baseline
    # generation by construction. The capture itself is made deterministic by the harness
    # freeze (ADR-005). A bare ubuntu-latest runner renders fonts differently and the
    # visual gate would false-fail.
    runs-on: ubuntu-latest
    # Digest-pinned (immutable) with the readable tag retained. MCR could in principle
    # retarget a mutable tag, which would silently change the font/browser environment
    # the committed linux baselines depend on. Digest of the v1.63.0-noble index.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # Firefox crashes in container jobs without adequate /dev/shm.
      options: --shm-size=1g
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Library checks (contract, CSS, SSR, DOM interactions)
        run: npm run verify

      - name: Build the examples and the browser harness
        run: |
          npm run example:build
          npm run example-trading:build
          npm run harness:build

      - name: Example checks (boots the real bundles in a DOM)
        run: npm run verify:example

      - name: Trading example checks (virtualization, ARIA, axe)
        run: npm run verify:example-trading

      # Browsers are preinstalled in the image at the matching version; no install step.
      # HOME must be writable by the job user for Firefox's profile bootstrap — the default
      # /github/home makes non-root Firefox exit with "Could not find profile folder".
      - name: Cross-browser suite (frame timing, layout, axe light + dark, visual regression)
        run: npm run verify:browser
        env:
          HOME: /tmp

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification
          path: verification
          retention-days: 14

  # Baselines are versioned inputs and are never auto-pushed. This job regenerates the
  # linux set in the EXACT environment the visual gate compares in — same container
  # image (digest), same shm, same HOME as the verify job — so generation environment
  # equals comparison environment by construction. Run after an intentional rendering
  # change (Playwright image bump, harness change):
  #   gh workflow run ci.yml --ref <branch>
  # then download the baselines-linux artifact, review the diff, and commit it.
  baselines:
    name: baselines (regenerate linux in the CI environment)
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
      - run: npm ci
      - run: npm run build
      - run: npm run harness:build
      - name: Regenerate linux baselines (compare env == generation env)
        run: npm run baselines:update
        env:
          HOME: /tmp
      - name: Upload baselines for review and commit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baselines-linux
          path: baselines
          retention-days: 14

  # Playwright's WebKit on Linux/Windows is a port, not the engine users run. This job measures
  # the real macOS WebKit engine to settle the outstanding dropped-frame question.
  browser-macos:
    name: browser (real WebKit on macOS)
    timeout-minutes: 35
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run harness:build
      - name: Install Playwright engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser suite (macOS WebKit)
        run: npm run verify:browser
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-macos
          path: verification
          retention-days: 14
  # macOS baselines: same pattern as the linux baselines job, but on a real macOS runner
  # so the generation environment equals the browser-macos comparison environment by
  # construction (both use macos-latest + the same Playwright install step). Run after
  # an intentional rendering change on macOS:
  #   gh workflow run ci.yml --ref <branch>
  # then download the baselines-macos artifact, review the diff, and commit it.
  baselines-macos:
    name: baselines (regenerate macOS in the CI environment)
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run harness:build
      - name: Install Playwright engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Regenerate macOS baselines (compare env == generation env)
        run: npm run baselines:update
      - name: Upload baselines for review and commit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baselines-macos
          path: baselines
          retention-days: 14

  # The one dimension the rest of this workflow never covers.
  #
  # Every job above runs the pinned toolchain on a Linux runner (or macOS for WebKit). The package
  # declares a wider promise - `engines: ^22.22.2 || ^24.15.0 || >=26.0.0` - and this repository is
  # also developed on Windows, where nothing ever ran the gates. Three separate spawn defects
  # (`check:pack`, the size gate, the consumer typecheck) hid behind that gap: each one failed only on
  # Windows while Linux CI stayed green, and each was found by a human reading a failure rather than
  # by this workflow.
  #
  # One matrix, two axes that both matter - a platform and a runtime version, expressed as explicit
  # `include` entries rather than a cross-product, because the combinations worth paying for are not
  # all of them. Adding macOS here is one line; it is left out on purpose because `browser-macos`
  # already builds on macOS.
  cross-platform:
    name: cross-platform (${{ matrix.os }}, node ${{ matrix.node }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      # Both entries are diagnostics: a Windows-only failure must not hide the Node-version result.
      fail-fast: false
      matrix:
        include:
          # The platform the gates have never run on. Cheap gates only: the browser suites are
          # environment-specific (the linux one needs the digest-pinned image) and keep their own jobs.
          - os: windows-latest
            node: '22.22.2'
          # The declared engines range is wider than any other job runs. `^24.15.0` is a promise to
          # consumers, so the untested line is verified here.
          - os: ubuntu-latest
            node: '24.x'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build

      # The gates whose correctness is platform-sensitive. Each keeps its own step for the same reason
      # the build job gives them one: the step is what runs, not the chain around it.
      - name: Package contract (zero deps, peer React, exports map)
        run: npm run check:contract
      - name: Published tarballs are correct (entry points, terms, no leaks)
        run: npm run check:pack
      - name: Install the packed tarballs outside the repo and use them
        run: npm run verify:consumer
      - name: CSS authoring contract
        run: npm run check:style
      - name: Typecheck (strict, no emit)
        run: npm run check:types
      - name: Unit tests
        run: npm test
      - name: Licence headers and manifests
        run: npm run check:license
      - name: Docs integrity (links, documented counts)
        run: npm run check:docs
      - name: Browser floor (document and code agree)
        run: npm run check:support
      - name: Perf retry policy
        run: npm run check:perf-policy
      - name: Bundle budgets
        run: npm run size

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-platform-${{ matrix.os }}-${{ matrix.node }}
          path: verification
          retention-days: 14
          if-no-files-found: ignore

